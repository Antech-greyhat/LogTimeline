<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-labelledby="logoTitle logoDesc" width="256" height="256">
  <title id="logoTitle">LogTimeline logo</title>
  <desc id="logoDesc">A rounded square badge containing a vertical timeline
    with four colored event nodes.</desc>

  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Badge body (not pure black; bordered for dark-theme contrast). -->
  <rect x="8" y="8" width="240" height="240" rx="48"
        fill="url(#badge)" stroke="#475569" stroke-width="4"/>

  <!-- Vertical timeline spine. -->
  <line x1="98" y1="56" x2="98" y2="200" stroke="#64748b" stroke-width="6"/>

  <!-- Event nodes down the spine, colored like the tool's output. -->
  <g stroke="#0f172a" stroke-width="4">
    <circle cx="98" cy="72"  r="16" fill="#22c55e"/>
    <circle cx="98" cy="128" r="16" fill="#ef4444"/>
    <circle cx="98" cy="184" r="16" fill="#06b6d4"/>
  </g>

  <!-- Short "entry" ticks to the right of each node, like log lines. -->
  <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="72"  x2="196" y2="72"/>
    <line x1="128" y1="128" x2="208" y2="128"/>
    <line x1="128" y1="184" x2="180" y2="184"/>
  </g>
</svg>
